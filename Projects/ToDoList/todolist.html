<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>רשימת משימות - ToDo List</title>
    <link rel="stylesheet" href="todolist.css">
</head>
<body>
    <div class="container">
        <h1>רשימת משימות</h1>
        <div class="todo-app">
            <div class="input-section">
                <input type="text" id="taskInput" placeholder="הוסף משימה חדשה..." maxlength="100">
                <button id="addTaskBtn" class="add-btn">
                    <i class="fas fa-plus"></i>
                    הוסף
                </button>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">הכל</button>
                <button class="filter-btn" data-filter="active">פעיל</button>
                <button class="filter-btn" data-filter="completed">הושלם</button>
            </div>

            <div class="stats">
                <span id="totalTasks">סה"כ משימות: 0</span>
                <span id="completedTasks">הושלמו: 0</span>
            </div>

            <ul id="taskList" class="task-list">
                <!-- Tasks will be added here dynamically -->
            </ul>

            <div class="clear-section">
                <button id="clearCompletedBtn" class="clear-btn">
                    <i class="fas fa-trash"></i>
                    נקה משימות הושלמו
                </button>
            </div>
        </div>
    </div>

    <script src="todolist.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</body>
</html>
